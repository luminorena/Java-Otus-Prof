plugins {
    id 'java'
}

group 'ru.otus'
version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.36'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'javax.servlet:javax.servlet-api:4.0.1'


}

test {
    useJUnitPlatform()
}