version: '3'

services:
  artemis:
    image: apache/activemq-artemis
    container_name: artemis
    ports:
      - "61616:61616"
      - "5672:5672"
      - "8161:8161"
    environment:
      - AMQ_USER=artemis
      - AMQ_PASSWORD=artemis

    volumes:
      - artemis-data:/var/lib/artemis-instance
      - artemis-config:/etc/artemis

volumes:
  artemis-data:
  artemis-config:
